[package]
name = "codacli-core"
version = "0.1.0"
edition = "2024"
description = "Pure core agent loop, provider runtime/transport, embedded kernel, and multimodal media protocols for Coda CLI"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
coda-protocol = { path = "../protocol" }
futures-util = "0.3"
http = "1"
httpdate = "1"
httparse = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
