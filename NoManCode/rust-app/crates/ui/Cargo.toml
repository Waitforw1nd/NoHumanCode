[package]
name = "peachsh-ui"
version = "0.1.0"
edition = "2024"
description = "Leptos CSR/WASM shell for the Peachsh harness"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.15", default-features = false, features = ["csr"] }
peachsh-protocol = { path = "../protocol" }
wasm-bindgen = "0.2"
