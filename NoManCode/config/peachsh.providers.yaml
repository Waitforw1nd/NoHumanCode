# 🍑sh harness provider aliases.
#
# This is a reference overlay for data/settings.yaml. Each alias is a separate
# Harness route, so Agent Team members can use different credential references
# and model ids without changing the Team execution provider.
#
# Put the actual values into the local credential store through Harness
# settings. The refs below are names only; no key is stored in this file.
llm-pi-ai:
  providers:
    peachsh-key-1:
      displayName: 🍑 Key 1
      apiKeyEnv: PEACHSH_KEY_1
      api: openai-completions
      baseURL: https://xpeach.codes/v1
      models:
        - id: gpt-5.6-sol
          name: GPT 5.6 Sol
    peachsh-key-2:
      displayName: 🍑 Key 2
      apiKeyEnv: PEACHSH_KEY_2
      api: openai-completions
      baseURL: https://xpeach.codes/v1
      models:
        - id: gpt-5.6-sol
          name: GPT 5.6 Sol
    peachsh-key-3:
      displayName: 🍑 Key 3
      apiKeyEnv: PEACHSH_KEY_3
      api: openai-completions
      baseURL: https://xpeach.codes/v1
      models:
        - id: gpt-5.6-sol
          name: GPT 5.6 Sol
