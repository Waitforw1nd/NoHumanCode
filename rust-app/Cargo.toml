[package]
name = "peachsh"
version = "0.2.0"
edition = "2024"
description = "Peachsh native multi-model coding harness"
license = "MIT"

[workspace]
members = ["crates/protocol", "crates/ui"]
resolver = "2"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
wasmi = { version = "2", default-features = true }
peachsh-protocol = { path = "crates/protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wat = "1"

[profile.release]
strip = true
lto = "thin"
